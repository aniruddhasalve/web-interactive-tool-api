services:
  tools-engine:
    build: .
    ports:
      - "8000:8000"
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-us.anthropic.claude-sonnet-4-6}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      ARTIFACT_DIR: /artifacts
      MAX_SITES_PER_JOB: 5
      DEFAULT_TIMEOUT_SECONDS: 30
      MAX_AGENT_STEPS: ${MAX_AGENT_STEPS:-60}
      MAX_AGENT_TIMEOUT_SECONDS: ${MAX_AGENT_TIMEOUT_SECONDS:-180}
      DEFAULT_REQUIRE_CONFIRMATION: ${DEFAULT_REQUIRE_CONFIRMATION:-true}
      BROWSER_PROFILE_DIR: /browser-profile
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-true}
      AGENT_FILE_DIR: /agent-files
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      ALLOW_PRIVATE_URLS: ${ALLOW_PRIVATE_URLS:-false}
      PRIVATE_URL_ALLOWLIST: ${PRIVATE_URL_ALLOWLIST:-}
    volumes:
      - ./artifacts:/artifacts
      - ./browser-profile:/browser-profile
      - ./agent-files:/agent-files
    restart: unless-stopped
