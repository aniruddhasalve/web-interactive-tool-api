services:
  tools-engine:
    build: .
    ports:
      - "8000:8000"
    environment:
      ARTIFACT_DIR: /artifacts
      MAX_SITES_PER_JOB: 5
      DEFAULT_TIMEOUT_SECONDS: 30
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
    volumes:
      - ./artifacts:/artifacts
    restart: unless-stopped
